<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Holiday & Leave Management Dashboard</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .custom-scrollbar::-webkit-scrollbar {
            width: 6px;
        }
        .custom-scrollbar::-webkit-scrollbar-track {
            background: #f1f1f1;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 4px;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover {
            background: #94a3b8;
        }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 font-sans antialiased min-h-screen flex flex-col">

    <!-- Top Navigation Bar -->
    <header class="bg-indigo-700 text-white shadow-lg sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex items-center justify-between h-16">
                <div class="flex items-center space-x-3">
                    <i class="fa-solid fa-calendar-check text-2xl text-amber-400"></i>
                    <span class="font-bold text-xl tracking-wide">HolidayPortal</span>
                </div>
                <div class="flex items-center space-x-4">
                    <button class="bg-indigo-600 hover:bg-indigo-500 text-white px-3 py-1.5 rounded-lg text-sm font-medium transition flex items-center gap-2">
                        <i class="fa-solid fa-plus"></i> Apply Leave
                    </button>
                    <div class="flex items-center space-x-2 border-l border-indigo-500 pl-4">
                        <img class="h-9 w-9 rounded-full object-cover border-2 border-amber-400" src="https://ui-avatars.com/api/?name=User+Admin&background=random" alt="User avatar">
                        <span class="text-sm font-medium hidden sm:inline">Rahul Sharma</span>
                    </div>
                </div>
            </div>
        </div>
    </header>

    <!-- Main Container -->
    <main class="flex-grow max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-8 space-y-8">
        
        <!-- Summary Stats Grid -->
        <section class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-5">
            <!-- Total Holidays -->
            <div class="bg-white rounded-xl shadow-sm p-5 border border-slate-200 flex items-center justify-between">
                <div>
                    <p class="text-xs font-semibold uppercase tracking-wider text-slate-500">Total Holidays</p>
                    <h3 class="text-2xl font-bold text-slate-800 mt-1" id="stat-total">16</h3>
                </div>
                <div class="h-12 w-12 bg-indigo-50 text-indigo-600 rounded-lg flex items-center justify-center text-xl">
                    <i class="fa-solid fa-umbrella-beach"></i>
                </div>
            </div>
            <!-- Gazetted Holidays -->
            <div class="bg-white rounded-xl shadow-sm p-5 border border-slate-200 flex items-center justify-between">
                <div>
                    <p class="text-xs font-semibold uppercase tracking-wider text-slate-500">Gazetted Holidays</p>
                    <h3 class="text-2xl font-bold text-slate-800 mt-1" id="stat-gazetted">12</h3>
                </div>
                <div class="h-12 w-12 bg-emerald-50 text-emerald-600 rounded-lg flex items-center justify-center text-xl">
                    <i class="fa-solid fa-flag"></i>
                </div>
            </div>
            <!-- Restricted Holidays -->
            <div class="bg-white rounded-xl shadow-sm p-5 border border-slate-200 flex items-center justify-between">
                <div>
                    <p class="text-xs font-semibold uppercase tracking-wider text-slate-500">Restricted (RH)</p>
                    <h3 class="text-2xl font-bold text-slate-800 mt-1" id="stat-restricted">04</h3>
                </div>
                <div class="h-12 w-12 bg-amber-50 text-amber-600 rounded-lg flex items-center justify-center text-xl">
                    <i class="fa-solid fa-star"></i>
                </div>
            </div>
            <!-- Balance Leaves -->
            <div class="bg-white rounded-xl shadow-sm p-5 border border-slate-200 flex items-center justify-between">
                <div>
                    <p class="text-xs font-semibold uppercase tracking-wider text-slate-500">Leave Balance</p>
                    <h3 class="text-2xl font-bold text-slate-800 mt-1">14 Days</h3>
                </div>
                <div class="h-12 w-12 bg-rose-50 text-rose-600 rounded-lg flex items-center justify-center text-xl">
                    <i class="fa-solid fa-user-clock"></i>
                </div>
            </div>
        </section>

        <!-- Main Content Area: Calendar & List -->
        <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
            
            <!-- Left Side: Interactive Calendar (2 Columns) -->
            <section class="lg:col-span-2 bg-white rounded-xl shadow-sm border border-slate-200 p-6 flex flex-col justify-between">
                <div>
                    <!-- Calendar Header Controls -->
                    <div class="flex items-center justify-between mb-6">
                        <h2 class="text-lg font-bold text-slate-800 flex items-center gap-2">
                            <i class="fa-regular fa-calendar-days text-indigo-600"></i>
                            <span id="calendar-month-year">October 2026</span>
                        </h2>
                        <div class="flex items-center space-x-2">
                            <button id="prev-month" class="p-2 hover:bg-slate-100 rounded-lg text-slate-600 transition border border-slate-200">
                                <i class="fa-solid fa-chevron-left text-xs"></i>
                            </button>
                            <button id="today-btn" class="px-3 py-1 text-xs font-semibold bg-slate-100 hover:bg-slate-200 text-slate-700 rounded-lg transition border border-slate-200">
                                Today
                            </button>
                            <button id="next-month" class="p-2 hover:bg-slate-100 rounded-lg text-slate-600 transition border border-slate-200">
                                <i class="fa-solid fa-chevron-right text-xs"></i>
                            </button>
                        </div>
                    </div>

                    <!-- Days of Week Header -->
                    <div class="grid grid-cols-7 gap-1 mb-2 text-center text-xs font-semibold text-slate-400 uppercase tracking-wider">
                        <div>Sun</div>
                        <div>Mon</div>
                        <div>Tue</div>
                        <div>Wed</div>
                        <div>Thu</div>
                        <div>Fri</div>
                        <div>Sat</div>
                    </div>

                    <!-- Calendar Grid -->
                    <div id="calendar-grid" class="grid grid-cols-7 gap-1 text-sm">
                        <!-- Dynamic Calendar Days Injected by JS -->
                    </div>
                </div>

                <!-- Calendar Legend -->
                <div class="mt-6 pt-4 border-t border-slate-100 flex flex-wrap items-center gap-4 text-xs font-medium text-slate-600">
                    <span class="flex items-center gap-1.5">
                        <span class="w-3 h-3 rounded-full bg-emerald-500 inline-block"></span> Gazetted
                    </span>
                    <span class="flex items-center gap-1.5">
                        <span class="w-3 h-3 rounded-full bg-amber-500 inline-block"></span> Restricted (RH)
                    </span>
                    <span class="flex items-center gap-1.5">
                        <span class="w-3 h-3 rounded-full bg-indigo-500 inline-block"></span> Optional / Casual
                    </span>
                </div>
            </section>

            <!-- Right Side: Holiday List (1 Column) -->
            <section class="bg-white rounded-xl shadow-sm border border-slate-200 p-6 flex flex-col">
                <div class="flex items-center justify-between mb-4">
                    <h2 class="text-lg font-bold text-slate-800">Upcoming Holidays</h2>
                    <span class="text-xs bg-indigo-50 text-indigo-600 font-semibold px-2.5 py-1 rounded-full">2026 List</span>
                </div>

                <!-- Filter / Search -->
                <div class="relative mb-4">
                    <i class="fa-solid fa-magnifying-glass absolute left-3 top-1/2 -translate-y-1/2 text-slate-400 text-xs"></i>
                    <input type="text" id="search-holiday" placeholder="Search festival or month..." class="w-full pl-9 pr-4 py-2 text-xs bg-slate-50 border border-slate-200 rounded-lg focus:outline-none focus:border-indigo-500 transition">
                </div>

                <!-- Holiday Items Scrollable Container -->
                <div id="holiday-list" class="space-y-3 flex-grow overflow-y-auto max-h-[420px] pr-1 custom-scrollbar">
                    <!-- Dynamic Holiday Items Injected by JS -->
                </div>
            </section>

        </div>
    </main>

    <!-- Footer -->
    <footer class="bg-white border-t border-slate-200 py-4 text-center text-xs text-slate-500 mt-auto">
        &copy; 2026 Enterprise Holiday System. All rights reserved.
    </footer>

    <!-- JavaScript Logic -->
    <script>
        // Sample Holiday Dataset (2026)
        const holidaysData = [
            { date: '2026-01-26', name: 'Republic Day', type: 'Gazetted', icon: 'fa-flag', color: 'emerald' },
            { date: '2026-03-04', name: 'Maha Shivratri', type: 'Restricted', icon: 'fa-om', color: 'amber' },
            { date: '2026-03-25', name: 'Holi', type: 'Gazetted', icon: 'fa-palette', color: 'emerald' },
            { date: '2026-04-02', name: 'Good Friday', type: 'Gazetted', icon: 'fa-cross', color: 'emerald' },
            { date: '2026-04-14', name: 'Ambedkar Jayanti', type: 'Optional', icon: 'fa-book-open', color: 'indigo' },
            { date: '2026-05-01', name: 'May Day', type: 'Optional', icon: 'fa-briefcase', color: 'indigo' },
            { date: '2026-08-15', name: 'Independence Day', type: 'Gazetted', icon: 'fa-dove', color: 'emerald' },
            { date: '2026-08-28', name: 'Raksha Bandhan', type: 'Restricted', icon: 'fa-heart', color: 'amber' },
            { date: '2026-09-04', name: 'Janmashtami', type: 'Restricted', icon: 'fa-spa', color: 'amber' },
            { date: '2026-10-02', name: 'Gandhi Jayanti', type: 'Gazetted', icon: 'fa-glasses', color: 'emerald' },
            { date: '2026-10-20', name: 'Dussehra', type: 'Gazetted', icon: 'fa-bow-arrow', color: 'emerald' },
            { date: '2026-11-08', name: 'Diwali', type: 'Gazetted', icon: 'fa-lightbulb', color: 'emerald' },
            { date: '2026-11-09', name: 'Govardhan Puja', type: 'Restricted', icon: 'fa-mountain', color: 'amber' },
            { date: '2026-11-23', name: 'Guru Nanak Jayanti', type: 'Gazetted', icon: 'fa-sun', color: 'emerald' },
            { date: '2026-12-25', name: 'Christmas', type: 'Gazetted', icon: 'fa-tree', color: 'emerald' }
        ];

        // Global State for Calendar
        let currentDate = new Date(2026, 9, 1); // Start default at October 2026

        // Color maps for dynamic Tailwind Styling
        const typeStyles = {
            Gazetted: {
                badgeBg: 'bg-emerald-100',
                badgeText: 'text-emerald-700',
                border: 'border-emerald-200',
                dot: 'bg-emerald-500',
                calBg: 'bg-emerald-50 text-emerald-900 border-emerald-300 font-bold',
                calLabel: 'bg-emerald-600 text-white'
            },
            Restricted: {
                badgeBg: 'bg-amber-100',
                badgeText: 'text-amber-700',
                border: 'border-amber-200',
                dot: 'bg-amber-500',
                calBg: 'bg-amber-50 text-amber-900 border-amber-300 font-bold',
                calLabel: 'bg-amber-500 text-white'
            },
            Optional: {
                badgeBg: 'bg-indigo-100',
                badgeText: 'text-indigo-700',
                border: 'border-indigo-200',
                dot: 'bg-indigo-500',
                calBg: 'bg-indigo-50 text-indigo-900 border-indigo-300 font-bold',
                calLabel: 'bg-indigo-600 text-white'
            }
        };

        // DOM Elements
        const calendarGrid = document.getElementById('calendar-grid');
        const monthYearText = document.getElementById('calendar-month-year');
        const prevBtn = document.getElementById('prev-month');
        const nextBtn = document.getElementById('next-month');
        const todayBtn = document.getElementById('today-btn');
        const holidayListContainer = document.getElementById('holiday-list');
        const searchInput = document.getElementById('search-holiday');

        // Render Calendar
        function renderCalendar() {
            calendarGrid.innerHTML = '';
            
            const year = currentDate.getFullYear();
            const month = currentDate.getMonth();

            // Set Header Text
            const monthNames = ["January", "February", "March", "April", "May", "June", "July", "August", "September", "October", "November", "December"];
            monthYearText.textContent = `${monthNames[month]} ${year}`;

            // First day of current month
            const firstDayIndex = new Date(year, month, 1).getDay();
            // Total days in current month
            const totalDays = new Date(year, month + 1, 0).getDate();
            // Total days in previous month
            const prevTotalDays = new Date(year, month, 0).getDate();

            // Render Previous Month Padding Days
            for (let x = firstDayIndex; x > 0; x--) {
                const dayDiv = document.createElement('div');
                dayDiv.className = 'h-24 p-1.5 border border-slate-100 rounded-lg text-slate-300 bg-slate-50/50 text-xs font-medium';
                dayDiv.textContent = prevTotalDays - x + 1;
                calendarGrid.appendChild(dayDiv);
            }

            // Render Current Month Days
            const today = new Date();
            for (let day = 1; day <= totalDays; day++) {
                const dayDiv = document.createElement('div');
                
                // Format YYYY-MM-DD
                const formattedMonth = String(month + 1).padStart(2, '0');
                const formattedDay = String(day).padStart(2, '0');
                const dateString = `${year}-${formattedMonth}-${formattedDay}`;

                // Check if holiday exists on this date
                const holiday = holidaysData.find(h => h.date === dateString);
                const isToday = today.getFullYear() === year && today.getMonth() === month && today.getDate() === day;

                let cellClasses = 'h-24 p-1.5 border rounded-lg transition-all flex flex-col justify-between relative text-xs ';
                
                if (holiday) {
                    const style = typeStyles[holiday.type] || typeStyles.Optional;
                    cellClasses += `${style.calBg} shadow-sm`;
                } else if (isToday) {
                    cellClasses += 'border-indigo-500 bg-indigo-50/30 text-indigo-700 font-bold';
                } else {
                    cellClasses += 'border-slate-100 bg-white text-slate-700 hover:bg-slate-50';
                }

                dayDiv.className = cellClasses;

                // Day Number Header
                let dayNumberHTML = `<div class="flex justify-between items-center"><span class="${isToday ? 'h-5 w-5 rounded-full bg-indigo-600 text-white flex items-center justify-center text-[11px]' : ''}">${day}</span></div>`;
                
                // Holiday Tag Box inside Calendar Date Cell
                let holidayHTML = '';
                if (holiday) {
                    const style = typeStyles[holiday.type] || typeStyles.Optional;
                    holidayHTML = `
                        <div class="mt-1 p-1 rounded ${style.calLabel} shadow-xs text-[10px] leading-tight font-medium overflow-hidden">
                            <div class="truncate font-semibold flex items-center gap-1">
                                <i class="fa-solid ${holiday.icon} text-[9px]"></i>
                                <span class="truncate">${holiday.name}</span>
                            </div>
                        </div>
                    `;
                }

                dayDiv.innerHTML = dayNumberHTML + holidayHTML;
                calendarGrid.appendChild(dayDiv);
            }
        }

        // Render Holiday List Section
        function renderHolidayList(filter = '') {
            holidayListContainer.innerHTML = '';
            
            const filteredHolidays = holidaysData.filter(h => 
                h.name.toLowerCase().includes(filter.toLowerCase()) || 
                h.type.toLowerCase().includes(filter.toLowerCase()) ||
                h.date.includes(filter)
            );

            if (filteredHolidays.length === 0) {
                holidayListContainer.innerHTML = `<p class="text-center text-xs text-slate-400 py-8">No holidays found</p>`;
                return;
            }

            filteredHolidays.forEach(h => {
                const dateObj = new Date(h.date);
                const dayNum = dateObj.getDate();
                const monthName = dateObj.toLocaleString('en-US', { month: 'short' });
                const dayName = dateObj.toLocaleString('en-US', { weekday: 'short' });

                const style = typeStyles[h.type] || typeStyles.Optional;

                const item = document.createElement('div');
                item.className = `p-3 rounded-xl border ${style.border} bg-white hover:shadow-md transition flex items-center justify-between cursor-pointer`;
                
                // Clicking item redirects calendar view to that month
                item.addEventListener('click', () => {
                    currentDate = new Date(dateObj.getFullYear(), dateObj.getMonth(), 1);
                    renderCalendar();
                });

                item.innerHTML = `
                    <div class="flex items-center space-x-3">
                        <div class="h-10 w-10 rounded-lg bg-slate-100 border border-slate-200 flex flex-col items-center justify-center text-slate-700">
                            <span class="text-xs font-bold leading-none">${dayNum}</span>
                            <span class="text-[9px] uppercase font-semibold text-slate-400">${monthName}</span>
                        </div>
                        <div>
                            <h4 class="text-xs font-bold text-slate-800 flex items-center gap-1.5">
                                <i class="fa-solid ${h.icon} text-slate-400 text-[10px]"></i>
                                ${h.name}
                            </h4>
                            <p class="text-[10px] text-slate-400">${dayName}</p>
                        </div>
                    </div>
                    <span class="text-[10px] font-semibold px-2 py-0.5 rounded-full ${style.badgeBg} ${style.badgeText}">
                        ${h.type}
                    </span>
                `;
                holidayListContainer.appendChild(item);
            });
        }

        // Quick Stats Update
        function updateStats() {
            document.getElementById('stat-total').textContent = holidaysData.length.toString().padStart(2, '0');
            document.getElementById('stat-gazetted').textContent = holidaysData.filter(h => h.type === 'Gazetted').length.toString().padStart(2, '0');
            document.getElementById('stat-restricted').textContent = holidaysData.filter(h => h.type === 'Restricted').length.toString().padStart(2, '0');
        }

        // Calendar Controls Events
        prevBtn.addEventListener('click', () => {
            currentDate.setMonth(currentDate.getMonth() - 1);
            renderCalendar();
        });

        nextBtn.addEventListener('click', () => {
            currentDate.setMonth(currentDate.getMonth() + 1);
            renderCalendar();
        });

        todayBtn.addEventListener('click', () => {
            currentDate = new Date();
            renderCalendar();
        });

        // Search Filter Event
        searchInput.addEventListener('input', (e) => {
            renderHolidayList(e.target.value);
        });

        // Initial Load
        renderCalendar();
        renderHolidayList();
        updateStats();
    </script>
</body>
</html>
